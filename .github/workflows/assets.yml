name: Store Assets

on:
  workflow_dispatch:

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Generate screenshots
        run: node scripts/gen-screenshots.js
        env:
          SITE_URL: https://gandzekas.github.io/geogive/
      - name: Generate feature graphic
        run: node scripts/gen-feature-graphic.js
      - uses: actions/upload-artifact@v4
        with:
          name: store-assets
          path: store/
